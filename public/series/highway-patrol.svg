<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="Title card for Highway Patrol">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101720"/>
      <stop offset="0.55" stop-color="#0e1116"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="62%">
      <stop offset="0" stop-color="#7d9dc4" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7d9dc4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#glow)"/>

  <text x="300" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="6" fill="#dbe4ee" opacity="0.5">MM YOTESHIN</text>

  <g opacity="0.9">
    <circle cx="300" cy="300" r="46" fill="none" stroke="#7d9dc4" stroke-width="3"/>
    <line x1="90" y1="380" x2="510" y2="380" stroke="#7d9dc4" stroke-width="2" stroke-opacity="0.55"/>
    <path d="M60 560 L300 380 L540 560" fill="none" stroke="#7d9dc4" stroke-width="3"/>
    <line x1="300" y1="560" x2="300" y2="392" stroke="#7d9dc4" stroke-width="4" stroke-dasharray="16 14"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#eef2f7" text-anchor="middle">
    <text x="300" y="590" font-size="64" letter-spacing="1">HIGHWAY</text>
    <text x="300" y="672" font-size="64" letter-spacing="8">PATROL</text>
  </g>

  <text x="300" y="736" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#7d9dc4">1955 · CRIME</text>

  <line x1="120" y1="790" x2="480" y2="790" stroke="#eef2f7" stroke-opacity="0.12"/>
  <text x="300" y="830" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="4" fill="#eef2f7" opacity="0.35">TITLE CARD · NOT OFFICIAL ARTWORK</text>
</svg>
