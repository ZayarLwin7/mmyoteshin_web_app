name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# -----------------------------------------------------------------------------
# A note on the database
# -----------------------------------------------------------------------------
# Next.js evaluates `revalidate`d pages at build time, and those pages read the
# catalogue. A production build therefore needs a reachable, migrated database.
# Rather than pointing CI at a shared environment — which would make builds
# non-hermetic and let a test run mutate real content — every job starts its own
# throwaway Postgres service container and migrates it from scratch. That also
# proves the migrations are reproducible, which is one of the acceptance
# criteria in the specification.
# -----------------------------------------------------------------------------

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mm_yoteshin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mm_yoteshin_test
      # CI-only value. Never reuse it anywhere real.
      SESSION_SECRET: ci-only-session-secret-value-that-is-long-enough
      SESSION_TTL_HOURS: "12"

      NEXT_PUBLIC_SITE_NAME: MM YoteShin
      NEXT_PUBLIC_SITE_URL: https://example.test
      NEXT_PUBLIC_SITE_DESCRIPTION: Continuous integration build.
      NEXT_PUBLIC_IMAGE_HOSTS: https://images.example.com
      NEXT_PUBLIC_CONTACT_EMAIL: hello@example.com
      NEXT_PUBLIC_TAKEDOWN_EMAIL: takedown@example.com
      NEXT_PUBLIC_ADS_ENABLED: "false"
      NEXT_PUBLIC_ANALYTICS_ENABLED: "false"

      RATE_LIMIT_AUTH_MAX: "100"
      RATE_LIMIT_AUTH_WINDOW_SECONDS: "300"
      RATE_LIMIT_REPORT_MAX: "50"
      RATE_LIMIT_REPORT_WINDOW_SECONDS: "3600"
      # Search is also rate-limited (spec §9). Generous, so a suite run cannot
      # trip it — the limit is asserted in unit and integration tests instead.
      RATE_LIMIT_SEARCH_MAX: "500"
      RATE_LIMIT_SEARCH_WINDOW_SECONDS: "300"

      # Enables the DB-backed integration tests (they are skipped otherwise).
      RUN_DB_TESTS: "1"
      ALLOW_DEV_SEED: "0"
      CI: "true"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Apply migrations to a clean database
        run: pnpm run db:migrate

      - name: Verify the migrated schema
        run: pnpm run db:check

      - name: Unit and integration tests
        run: pnpm test

      - name: Production build
        run: pnpm run build

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the working tree.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies for known vulnerabilities
        # A high or critical advisory fails the build on purpose. If a transitive
        # dependency cannot be fixed yet, record it in docs/security.md with a
        # review date rather than lowering this threshold.
        run: pnpm audit --audit-level=high

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: End-to-end tests
    # Browser tests are slow and need seeded data, so they run on demand rather
    # than on every pull request. Trigger with:
    #   gh workflow run CI --ref <branch>
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mm_yoteshin_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mm_yoteshin_e2e
      SESSION_SECRET: ci-only-session-secret-value-that-is-long-enough
      NEXT_PUBLIC_SITE_NAME: MM YoteShin
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_DESCRIPTION: End-to-end test run.
      NEXT_PUBLIC_IMAGE_HOSTS: https://images.example.com
      NEXT_PUBLIC_CONTACT_EMAIL: hello@example.com
      NEXT_PUBLIC_TAKEDOWN_EMAIL: takedown@example.com
      NEXT_PUBLIC_ADS_ENABLED: "false"
      NEXT_PUBLIC_ANALYTICS_ENABLED: "false"

      # The suite signs in repeatedly; the default 10-per-5-minutes limit would
      # start rejecting it partway through.
      RATE_LIMIT_AUTH_MAX: "200"
      RATE_LIMIT_AUTH_WINDOW_SECONDS: "300"
      # Several specs exercise /search; keep it well clear of the allowance.
      RATE_LIMIT_SEARCH_MAX: "500"
      RATE_LIMIT_SEARCH_WINDOW_SECONDS: "300"

      ALLOW_DEV_SEED: "1"
      BOOTSTRAP_ADMIN_EMAIL: e2e@example.test
      BOOTSTRAP_ADMIN_PASSWORD: E2e-Password-1
      E2E_ADMIN_EMAIL: e2e@example.test
      E2E_ADMIN_PASSWORD: E2e-Password-1
      E2E_BASE_URL: http://127.0.0.1:3000
      CI: "true"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm run db:migrate

      - name: Seed development data
        run: pnpm run db:seed

      - name: Create the end-to-end administrator
        run: pnpm run admin:create

      - name: Build the application
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
